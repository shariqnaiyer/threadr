# threadr bindings for tmux. Add to ~/.tmux.conf, or:
#   source-file /path/to/threadr/extras/tmux.conf

# prefix f: pick a past session in a new window and resume it there.
bind-key f new-window -n threadr threadr

# prefix T: open the fork map in your browser.
bind-key T run-shell -b "threadr tree --html >/dev/null"
